services:
  frontend:
    image: node:24-bookworm
    container_name: saas_frontend
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./platform-frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./infra
      dockerfile: Dockerfile.web
    container_name: saas_backend
    ports:
      - "8081:80"
    volumes:
      - ./platform-backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: saas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: saasdb
      MYSQL_USER: saasuser
      MYSQL_PASSWORD: saaspass1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: saas_phpmyadmin
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root1234
    ports:
      - "8082:80"

volumes:
  mysql_data: