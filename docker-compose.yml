services:
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: saas_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./platform-frontend:/app/platform-frontend
      - ./packages:/app/packages
      - frontend_node_modules:/app/platform-frontend/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://web:80
      # Windows + Docker Desktop(WSL2) bind mount 에서는 inotify 가 끊긴다.
      # Vite 의 watcher 를 polling 모드로 전환해 HMR 을 살린다.
      VITE_USE_POLLING: "1"
      # chokidar 폴백용(라이브러리 직접 사용 케이스 대비).
      CHOKIDAR_USEPOLLING: "true"
      # 개발자 전용 latency/debug 오버레이.
      # 운영 빌드에선 반드시 비활성/삭제. 활성화돼도 사용자 name='dev' 일 때만 렌더된다.
      VITE_ENABLE_LATENCY_OVERLAY: "true"
    depends_on:
      - web

  web:
    build:
      context: ./infra
      dockerfile: Dockerfile.web
    container_name: saas_backend
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      AI_DAILY_LIMIT_FREE: ${AI_DAILY_LIMIT_FREE:-5}
      AI_DAILY_LIMIT_STARTER: ${AI_DAILY_LIMIT_STARTER:-30}
      AI_DAILY_LIMIT_PRO: ${AI_DAILY_LIMIT_PRO:-100}
      AI_DAILY_LIMIT_TEAM: ${AI_DAILY_LIMIT_TEAM:-300}
    ports:
      - "8000:80"
    volumes:
      - ./platform-backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: saas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: saasdb
      MYSQL_USER: saasuser
      MYSQL_PASSWORD: saaspass1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  frontend_node_modules:
